name: Restrict Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close-unauthorized-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Close unauthorized pull requests
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 許可するユーザー名のリスト（現在は自分のみ）
            const allowedUsers = ['df-yamashitamasashi'];
            const author = context.payload.pull_request.user.login;

            if (!allowedUsers.includes(author)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `👋 @${author} 様、本リポジトリへのご関心ありがとうございます。\n\n現在、本リポジトリでは特定メンバー以外からのプルリクエストを受け付けておりません（Forkしてのご利用・改変は歓迎いたします）。そのため、本プルリクエストは自動でクローズさせていただきます。`
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                state: 'closed'
              });
            }
