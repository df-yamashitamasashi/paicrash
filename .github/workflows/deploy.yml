name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC 認証に必要
  contents: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1
  SERVICE_NAME: paicrash-server
  WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # 型チェック & Lint
      - run: pnpm exec tsc --noEmit

      # GCP OIDC 認証 (Workload Identity Federation)
      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ env.WIF_PROVIDER }}"
          service_account: "${{ env.WIF_SERVICE_ACCOUNT }}"

      # Google Cloud SDK セットアップ
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      # Docker 認証 (Artifact Registry)
      - name: "Docker Auth"
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # イメージビルド & プッシュ
      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_NAME: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/paicrash-repo/${{ env.SERVICE_NAME }}
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest

      # Cloud Run へのデプロイ
      - name: "Deploy to Cloud Run"
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          service: "${{ env.SERVICE_NAME }}"
          region: "${{ env.REGION }}"
          image: "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/paicrash-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}"
